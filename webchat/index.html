<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 对话 — JAcoworks</title>
</head>
<body>
  <div id="root"></div>
  <script>
    // Dev mode: inject from Vite env (see .env.local)
    // Production: Website Rust template overwrites these in chat.html
    window.__GATEWAY_URL__ = window.__GATEWAY_URL__ || "%VITE_GATEWAY_URL%";
    window.__AUTH_TOKEN__ = window.__AUTH_TOKEN__ || "%VITE_AUTH_TOKEN%";
    window.__USER_NAME__ = window.__USER_NAME__ || "%VITE_USER_NAME%";
    window.__OPENCLAW_TOKEN__ = window.__OPENCLAW_TOKEN__ || "%VITE_OPENCLAW_TOKEN%";
    window.__OPENCLAW_WS_PORT__ = window.__OPENCLAW_WS_PORT__ || Number("%VITE_OPENCLAW_WS_PORT%") || 0;
    window.__OPENCLAW_VNC_URL__ = window.__OPENCLAW_VNC_URL__ || "%VITE_OPENCLAW_VNC_URL%";
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
