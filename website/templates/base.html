<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JAcoworks{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
        },
        colors: {
          cream: '#F5F0EB',
          'cream-dark': '#EDE5DC',
          terra: '#C4724A',
          'terra-dark': '#A85D3A',
          'terra-light': '#D4956F',
        },
        borderRadius: {
          'xl': '1rem',
          '2xl': '1.5rem',
        }
      }
    }
  }
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  {% block head %}{% endblock %}
</head>
<body class="bg-cream text-gray-800 min-h-screen flex flex-col font-sans">
  <!-- Navigation -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-cream-dark">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2">
          <span class="text-xl font-bold text-terra">JAcoworks</span>
        </a>

        <!-- Desktop Nav -->
        <div class="hidden md:flex items-center gap-8">
          <a href="/" class="text-gray-600 hover:text-terra transition-colors">首页</a>
          <a href="/download" class="text-gray-600 hover:text-terra transition-colors">下载</a>
          <a href="/docs" class="text-gray-600 hover:text-terra transition-colors">文档</a>
          <a href="/feedback" class="text-gray-600 hover:text-terra transition-colors">反馈</a>
        </div>

        <!-- GitHub -->
        <div class="hidden md:flex items-center gap-4">
          <a href="https://github.com/fran0220/jacoworks" target="_blank" rel="noopener"
             class="text-gray-500 hover:text-gray-800 transition-colors">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/>
            </svg>
          </a>
        </div>

        <!-- Mobile menu button -->
        <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg hover:bg-cream-dark transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden md:hidden border-t border-cream-dark bg-white">
      <div class="px-4 py-3 space-y-2">
        <a href="/" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-cream hover:text-terra transition-colors">首页</a>
        <a href="/download" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-cream hover:text-terra transition-colors">下载</a>
        <a href="/docs" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-cream hover:text-terra transition-colors">文档</a>
        <a href="/feedback" class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-cream hover:text-terra transition-colors">反馈</a>
        <a href="https://github.com/fran0220/jacoworks" target="_blank" rel="noopener"
           class="block px-3 py-2 rounded-lg text-gray-600 hover:bg-cream hover:text-terra transition-colors">GitHub</a>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-cream-dark mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
        <div class="col-span-1 md:col-span-2">
          <span class="text-xl font-bold text-terra">JAcoworks</span>
          <p class="mt-3 text-gray-500 text-sm leading-relaxed">
            企业 AI 协同办公平台<br>
            本地优先，隐私安全，多模型支持
          </p>
        </div>
        <div>
          <h4 class="font-semibold text-gray-800 mb-3">产品</h4>
          <ul class="space-y-2 text-sm text-gray-500">
            <li><a href="/download" class="hover:text-terra transition-colors">下载</a></li>
            <li><a href="/docs" class="hover:text-terra transition-colors">文档</a></li>
            <li><a href="/about" class="hover:text-terra transition-colors">关于</a></li>
          </ul>
        </div>
        <div>
          <h4 class="font-semibold text-gray-800 mb-3">社区</h4>
          <ul class="space-y-2 text-sm text-gray-500">
            <li><a href="https://github.com/fran0220/jacoworks" target="_blank" rel="noopener" class="hover:text-terra transition-colors">GitHub</a></li>
            <li><a href="/feedback" class="hover:text-terra transition-colors">反馈</a></li>
          </ul>
        </div>
      </div>
      <div class="mt-8 pt-8 border-t border-cream-dark text-center text-sm text-gray-400">
        &copy; 2025 JAcoworks. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
