{% extends "base.html" %}

{% block title %}AI 对话 — JAcoworks{% endblock %}

{% block head %}
<style>
  .chat-page { max-width: 56rem; margin: 0 auto; padding: 0 1rem; display: flex; flex-direction: column; height: calc(100vh - 65px); }

  /* Status bar */
  .chat-status { display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem 0; font-size: 0.75rem; color: #9ca3af; }
  .chat-userbar { display: flex; align-items: center; justify-content: space-between; }
  .chat-userbar .user-info { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: #374151; font-weight: 500; }
  .chat-userbar .logout-btn {
    background: none; border: 1px solid #d1d5db; border-radius: 0.375rem;
    padding: 0.25rem 0.625rem; font-size: 0.75rem; color: #6b7280;
    cursor: pointer; transition: all 0.15s;
  }
  .chat-userbar .logout-btn:hover { border-color: #ef4444; color: #ef4444; }
  .status-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; }
  .status-dot.connected { background: #22c55e; }
  .status-dot.connecting { background: #f59e0b; animation: blink 1s infinite; }
  .status-dot.disconnected { background: #ef4444; }

  /* Messages */
  .chat-messages { flex: 1; overflow-y: auto; padding: 0.5rem 0; scroll-behavior: smooth; }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-track { background: transparent; }
  .chat-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }

  .msg { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; max-width: 80%; }
  .msg-user { margin-left: auto; flex-direction: row-reverse; }
  .msg-avatar {
    width: 2rem; height: 2rem; border-radius: 0.5rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 600; flex-shrink: 0;
  }
  .msg-user .msg-avatar { background: #C4724A; color: #fff; }
  .msg-bot .msg-avatar { background: #1a1a2e; color: #fff; }
  .msg-body {
    padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 0.875rem; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-user .msg-body { background: #C4724A; color: #fff; border-bottom-right-radius: 0.25rem; }
  .msg-bot .msg-body { background: #fff; color: #1f2937; border: 1px solid #e5e7eb; border-bottom-left-radius: 0.25rem; }
  .msg-bot .msg-body code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.8125rem; }
  .msg-bot .msg-body pre { background: #1f2937; color: #e5e7eb; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; }
  .msg-bot .msg-body pre code { background: transparent; padding: 0; }

  @keyframes blink { 0%,80%,100%{ opacity:0.3; } 40%{ opacity:1; } }

  .chat-welcome {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; color: #9ca3af;
  }
  .chat-welcome svg { width: 3.5rem; height: 3.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
  .chat-welcome h3 { font-size: 1rem; font-weight: 600; color: #6b7280; margin-bottom: 0.25rem; }
  .chat-welcome p { font-size: 0.8125rem; }

  .chat-input-area { border-top: 1px solid #e5e7eb; padding: 0.75rem 0 1rem; flex-shrink: 0; }
  .chat-input-row { display: flex; gap: 0.75rem; align-items: flex-end; }
  .chat-textarea {
    flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 0.75rem;
    padding: 0.625rem 1rem; font-size: 0.875rem; line-height: 1.5;
    max-height: 140px; outline: none; transition: border-color 0.15s; font-family: inherit;
  }
  .chat-textarea:focus { border-color: #C4724A; box-shadow: 0 0 0 3px rgba(196,114,74,0.1); }
  .chat-send {
    background: #C4724A; color: #fff; border: none; border-radius: 0.75rem;
    padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; transition: background 0.15s; white-space: nowrap;
  }
  .chat-send:hover { background: #A85D3A; }
  .chat-send:disabled { opacity: 0.5; cursor: not-allowed; }
  .chat-abort {
    background: #ef4444; color: #fff; border: none; border-radius: 0.75rem;
    padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500;
    cursor: pointer; transition: background 0.15s; white-space: nowrap; display: none;
  }
  .chat-abort:hover { background: #dc2626; }
</style>
{% endblock %}

{% block content %}
<div class="chat-page" id="chatApp">
  <!-- User bar + status -->
  <div class="chat-status">
    <div class="chat-userbar" style="flex:1">
      <div class="user-info">
        <span class="status-dot disconnected" id="statusDot"></span>
        <span id="statusText">正在连接...</span>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem">
        <span style="font-size:0.75rem;color:#9ca3af">{{ user_name }}</span>
        <form method="post" action="/logout" style="margin:0">
          <button type="submit" class="logout-btn">退出</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chatMessages">
    <div class="chat-welcome" id="chatWelcome">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
      </svg>
      <h3>JAcoworks AI 助手</h3>
      <p>输入消息开始对话</p>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="chat-input-row">
      <textarea class="chat-textarea" id="chatInput" placeholder="输入消息... (Shift+Enter 换行)" rows="1"></textarea>
      <button class="chat-send" id="sendBtn" disabled>发送</button>
      <button class="chat-abort" id="abortBtn">停止</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  window.__GATEWAY_URL__ = "{{ gateway_url }}";
  window.__AUTH_TOKEN__ = "{{ auth_token }}";
</script>
<script src="/static/js/chat.js"></script>
{% endblock %}
