name: Distribute Desktop

# Standalone workflow: upload build artifacts to COS + register release in DB.
# Can be re-triggered independently without rebuilding (saves ~40 min).
#
# Strategy: SCP artifacts to jingao (Beijing), then coscli from jingao to COS
# (same-region internal network, ~100 MB/s vs 15 KB/s from GitHub US runners).

on:
  # Called automatically from release-desktop.yml after build
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      run_id:
        type: string
        required: false
        description: 'Workflow run ID to download artifacts from (empty = current run)'

  # Manual re-trigger (e.g. after COS upload failure)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.4.2)'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID with build artifacts (find in Actions tab URL)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
    steps:
      # ── 1. Download artifacts from GitHub ──
      - name: Download build artifacts (cross-run)
        if: inputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: desktop-*
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts (current run)
        if: inputs.run_id == ''
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: desktop-*

      - name: Verify artifacts
        run: |
          echo "📦 Downloaded artifacts:"
          for dir in all-artifacts/desktop-*/; do
            [ -d "$dir" ] || continue
            echo "  $(basename "$dir"):"
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              FNAME=$(basename "$f")
              FSIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
              echo "    ${FNAME} ($(numfmt --to=iec $FSIZE))"
            done
          done
          COUNT=$(find all-artifacts -maxdepth 1 -type d -name 'desktop-*' | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 1 ]; then
            echo "❌ No desktop-* artifact directories found!"
            exit 1
          fi
          echo "✅ Found $COUNT platform artifacts"

      # ── 2. Setup SSH to jingao ──
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Reusable SSH/SCP aliases
          echo "SSH_CMD=ssh -i ~/.ssh/deploy_key -o ConnectTimeout=10" >> "$GITHUB_ENV"

      # ── 3. SCP artifacts to jingao, then coscli from jingao (internal network) ──
      - name: Upload to COS via jingao relay
        env:
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          VERSION="${{ inputs.version }}"
          HOST="${SSH_USER}@${SSH_HOST}"
          SSH="${SSH_CMD}"
          SCP="scp -i ~/.ssh/deploy_key -o ConnectTimeout=10"
          REMOTE_DIR="/tmp/release-${VERSION}"

          echo "📤 Transferring artifacts to jingao..."
          $SSH "$HOST" "rm -rf ${REMOTE_DIR} && mkdir -p ${REMOTE_DIR}"

          # Flatten all artifacts into a single dir, carry .platform manifests
          for dir in all-artifacts/desktop-*/; do
            [ -d "$dir" ] || continue
            PLATFORM_DIR=$(basename "$dir")
            PLATFORM=""
            [ -f "${dir}.platform" ] && PLATFORM=$(cat "${dir}.platform" | tr -d '[:space:]')

            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              [ "$FILENAME" = ".platform" ] && continue
              echo "  ⬆️  ${FILENAME}"
              $SCP "$file" "${HOST}:${REMOTE_DIR}/${FILENAME}"
              # Also transfer .sig files
              [ -f "${file}.sig" ] && $SCP "${file}.sig" "${HOST}:${REMOTE_DIR}/${FILENAME}.sig"
            done

            # Write platform manifest on remote
            if [ -n "$PLATFORM" ]; then
              $SSH "$HOST" "echo '${PLATFORM}' > ${REMOTE_DIR}/.platform-${PLATFORM_DIR}"
            fi
          done
          echo "✅ All artifacts transferred to jingao"

          # Install coscli on jingao if not present, then upload
          echo ""
          echo "📦 Uploading from jingao to COS (internal network)..."
          $SSH "$HOST" bash -s -- "$VERSION" "$COS_SECRET_ID" "$COS_SECRET_KEY" "$COS_BUCKET" "$COS_REGION" "$REMOTE_DIR" <<'REMOTE_SCRIPT'
          set -euo pipefail
          VERSION="$1"; COS_SID="$2"; COS_SKEY="$3"; BUCKET="$4"; REGION="$5"; DIR="$6"

          # Ensure coscli is available
          if ! command -v coscli &>/dev/null; then
            echo "📥 Installing coscli on jingao..."
            sudo curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o /usr/local/bin/coscli
            sudo chmod +x /usr/local/bin/coscli
          fi
          coscli --version

          # Write config
          printf 'cos:\n  base:\n    secretid: %s\n    secretkey: %s\n  buckets:\n    - name: %s\n      alias: cos\n      endpoint: cos.%s.myqcloud.com\n' \
            "$COS_SID" "$COS_SKEY" "$BUCKET" "$REGION" > /tmp/.cos-release.yaml

          UPLOADED=0; FAILED=0
          for file in "${DIR}"/*; do
            [ -f "$file" ] || continue
            FILENAME=$(basename "$file")
            case "$FILENAME" in .platform-*) continue;; esac

            FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
            COS_PATH="cos://${BUCKET}/releases/${VERSION}/${FILENAME}"
            echo "  ⬆️  ${FILENAME} ($(numfmt --to=iec $FILESIZE))"

            if coscli cp -c /tmp/.cos-release.yaml "$file" "$COS_PATH"; then
              echo "  ✅ ${FILENAME}"
              UPLOADED=$((UPLOADED + 1))
            else
              echo "  ❌ ${FILENAME} upload failed!"
              FAILED=$((FAILED + 1))
            fi
          done

          rm -f /tmp/.cos-release.yaml

          echo ""
          echo "📊 Upload summary: ${UPLOADED} succeeded, ${FAILED} failed"
          if [ "$FAILED" -gt 0 ]; then echo "❌ Some uploads failed!"; exit 1; fi
          if [ "$UPLOADED" -eq 0 ]; then echo "❌ No files uploaded!"; exit 1; fi
          echo "✅ All artifacts at: https://${BUCKET}.cos.${REGION}.myqcloud.com/releases/${VERSION}/"
          REMOTE_SCRIPT

      # ── 4. Register release in database (psql on jingao) ──
      - name: Register release in database
        env:
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          VERSION="${{ inputs.version }}"
          BASE_URL="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/releases/${VERSION}"
          HOST="${SSH_USER}@${SSH_HOST}"
          SSH="${SSH_CMD}"
          REMOTE_DIR="/tmp/release-${VERSION}"

          # Build SQL from platform manifests
          SQL_FILE=$(mktemp)
          printf 'BEGIN;\nUPDATE releases SET is_latest = false WHERE is_latest = true;\n' > "$SQL_FILE"

          echo "INSERT INTO releases (id, version, notes, pub_date, is_latest)
            VALUES (gen_random_uuid()::text, '${VERSION}', 'See changelog for details.', now(), true)
            ON CONFLICT (version) DO UPDATE SET is_latest = true, notes = EXCLUDED.notes;" >> "$SQL_FILE"

          for dir in all-artifacts/desktop-*/; do
            [ -d "$dir" ] || continue
            PLATFORM=""
            if [ -f "${dir}.platform" ]; then
              PLATFORM=$(cat "${dir}.platform" | tr -d '[:space:]')
            fi
            [ -z "$PLATFORM" ] && continue

            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              case "$FILENAME" in *.sig|.platform) continue;; esac

              FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              DOWNLOAD_URL="${BASE_URL}/${FILENAME}"

              SIG=''
              if [ -f "${file}.sig" ]; then
                SIG=$(cat "${file}.sig")
              fi

              echo "INSERT INTO release_assets (id, release_id, platform, download_url, signature, file_size)
                SELECT gen_random_uuid()::text, r.id, '${PLATFORM}', '${DOWNLOAD_URL}', '${SIG}', ${FILESIZE}
                FROM releases r WHERE r.version = '${VERSION}'
                ON CONFLICT DO NOTHING;" >> "$SQL_FILE"

              echo "  📦 ${PLATFORM} → ${FILENAME} (${FILESIZE} bytes)"
            done
          done

          echo "COMMIT;" >> "$SQL_FILE"

          $SSH "$HOST" "PGPASSWORD='${DB_PASSWORD}' psql -h 127.0.0.1 -U postgres -d jacoworks -v ON_ERROR_STOP=1" < "$SQL_FILE"
          rm -f "$SQL_FILE"
          echo "✅ Release registered in database (is_latest=true)"

      # ── 5. Cleanup remote temp files ──
      - name: Cleanup jingao temp files
        if: always()
        env:
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
        run: |
          VERSION="${{ inputs.version }}"
          ${SSH_CMD} "${SSH_USER}@${SSH_HOST}" "rm -rf /tmp/release-${VERSION}" 2>/dev/null || true
