name: Distribute Desktop (Manual)

# Standalone workflow: re-upload artifacts to COS + register in DB.
# Use when the inline distribute step in release-desktop.yml fails
# and you want to retry without rebuilding (~40 min saved).
#
# Requires: run_id from a successful build run (find in Actions tab URL).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.4.3)'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID with build artifacts (find in Actions tab URL)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
      COS_ACCEL_ENDPOINT: cos.accelerate.myqcloud.com
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ inputs.run_id }}"
          REPO="${{ github.repository }}"

          echo "📥 Downloading artifacts from run ${RUN_ID}..."

          ARTIFACTS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("desktop-")) | .name')

          if [ -z "$ARTIFACTS" ]; then
            echo "❌ No desktop-* artifacts found in run ${RUN_ID}"
            exit 1
          fi

          mkdir -p artifacts
          for ART_NAME in $ARTIFACTS; do
            echo "  📥 ${ART_NAME}..."
            mkdir -p "artifacts/${ART_NAME}"
            ART_ID=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" \
              --jq ".artifacts[] | select(.name==\"${ART_NAME}\") | .id")
            gh api "repos/${REPO}/actions/artifacts/${ART_ID}/zip" > "/tmp/${ART_NAME}.zip"
            (cd "artifacts/${ART_NAME}" && unzip -q "/tmp/${ART_NAME}.zip")
            rm -f "/tmp/${ART_NAME}.zip"
            echo "    ✅ $(ls "artifacts/${ART_NAME}" | wc -l) files"
          done

      - name: Upload to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          VERSION="${{ inputs.version }}"

          curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o /usr/local/bin/coscli
          chmod +x /usr/local/bin/coscli

          printf 'cos:\n  base:\n    secretid: %s\n    secretkey: %s\n  buckets:\n    - name: %s\n      alias: cos\n      endpoint: %s\n' \
            "$COS_SECRET_ID" "$COS_SECRET_KEY" "$COS_BUCKET" "$COS_ACCEL_ENDPOINT" > /tmp/.cos.yaml

          UPLOADED=0
          FAILED=0

          for dir in artifacts/desktop-*/; do
            [ -d "$dir" ] || continue
            echo "📦 $(basename "$dir"):"

            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              case "$FILENAME" in .platform) continue;; esac

              FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              COS_PATH="cos://${COS_BUCKET}/releases/${VERSION}/${FILENAME}"
              echo "  ⬆️  ${FILENAME} ($(numfmt --to=iec $FILESIZE))"

              if coscli cp -c /tmp/.cos.yaml "$file" "$COS_PATH"; then
                echo "  ✅ ${FILENAME}"
                UPLOADED=$((UPLOADED + 1))
              else
                echo "  ❌ ${FILENAME} upload failed!"
                FAILED=$((FAILED + 1))
              fi
            done
          done

          rm -f /tmp/.cos.yaml

          echo ""
          echo "📊 Upload: ${UPLOADED} succeeded, ${FAILED} failed"
          if [ "$FAILED" -gt 0 ]; then echo "❌ Some uploads failed!"; exit 1; fi
          if [ "$UPLOADED" -eq 0 ]; then echo "❌ No files uploaded!"; exit 1; fi

          echo "✅ All at: https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/releases/${VERSION}/"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Register release in DB
        env:
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          VERSION="${{ inputs.version }}"
          BASE_URL="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/releases/${VERSION}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 ${SSH_USER}@${SSH_HOST}"

          SQL="BEGIN;
          UPDATE releases SET is_latest = false WHERE is_latest = true;
          INSERT INTO releases (id, version, notes, pub_date, is_latest)
            VALUES (gen_random_uuid()::text, '${VERSION}', 'See changelog for details.', now(), true)
            ON CONFLICT (version) DO UPDATE SET is_latest = true, notes = EXCLUDED.notes;"

          for dir in artifacts/desktop-*/; do
            [ -d "$dir" ] || continue
            PLATFORM=""
            [ -f "${dir}.platform" ] && PLATFORM=$(cat "${dir}.platform" | tr -d '[:space:]')
            [ -z "$PLATFORM" ] && continue

            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              case "$FILENAME" in *.sig|.platform) continue;; esac

              FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              DOWNLOAD_URL="${BASE_URL}/${FILENAME}"

              SIG=""
              [ -f "${file}.sig" ] && SIG=$(cat "${file}.sig")

              SQL="${SQL}
              INSERT INTO release_assets (id, release_id, platform, download_url, signature, file_size)
                SELECT gen_random_uuid()::text, r.id, '${PLATFORM}', '${DOWNLOAD_URL}', '${SIG}', ${FILESIZE}
                FROM releases r WHERE r.version = '${VERSION}'
                ON CONFLICT DO NOTHING;"

              echo "  📦 ${PLATFORM} → ${FILENAME} (${FILESIZE} bytes)"
            done
          done

          SQL="${SQL}
          COMMIT;"

          echo "$SQL" | $SSH_CMD "PGPASSWORD='${DB_PASSWORD}' psql -h 127.0.0.1 -U postgres -d jacoworks -v ON_ERROR_STOP=1"

          echo "✅ Release ${VERSION} registered (is_latest=true)"
          echo "🎉 Distribution complete!"
