name: Distribute Desktop

# Standalone workflow: download artifacts on jingao, upload to COS, register DB.
# Can be re-triggered independently without rebuilding (saves ~40 min).
#
# Strategy: SSH to jingao → gh CLI downloads artifacts from GitHub API → coscli
# uploads to COS via internal network. Zero cross-ocean data transfer from runner.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      run_id:
        type: string
        required: false
        description: 'Workflow run ID to download artifacts from (empty = current run)'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.4.2)'
        required: true
        type: string
      run_id:
        description: 'Workflow run ID with build artifacts (find in Actions tab URL)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
    steps:
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Download artifacts + upload COS + register DB (all on jingao)
        env:
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ inputs.version }}"
          RUN_ID="${{ inputs.run_id || github.run_id }}"
          REPO="${{ github.repository }}"
          SSH="ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30"
          HOST="${SSH_USER}@${SSH_HOST}"

          # Pass all params + secrets via env to remote script (avoids quoting issues)
          $SSH "$HOST" \
            "VERSION='${VERSION}' \
             RUN_ID='${RUN_ID}' \
             REPO='${REPO}' \
             GH_TOKEN='${GH_TOKEN}' \
             COS_SID='${COS_SECRET_ID}' \
             COS_SKEY='${COS_SECRET_KEY}' \
             COS_BUCKET='${COS_BUCKET}' \
             COS_REGION='${COS_REGION}' \
             DB_PASSWORD='${DB_PASSWORD}' \
             bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          WORK_DIR="/tmp/release-${VERSION}"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"

          # ── 1. Install tools if missing ──
          if ! command -v gh &>/dev/null; then
            echo "📥 Installing gh CLI..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          fi

          if ! command -v coscli &>/dev/null; then
            echo "📥 Installing coscli..."
            sudo curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o /usr/local/bin/coscli
            sudo chmod +x /usr/local/bin/coscli
          fi

          echo "📦 gh $(gh --version | head -1), coscli $(coscli --version 2>&1 | grep -oP 'v[\d.]+')"

          # ── 2. Download artifacts from GitHub API ──
          echo ""
          echo "📥 Downloading artifacts from run ${RUN_ID}..."
          export GH_TOKEN

          ARTIFACTS=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("desktop-")) | .name')
          if [ -z "$ARTIFACTS" ]; then
            echo "❌ No desktop-* artifacts found in run ${RUN_ID}"
            exit 1
          fi

          for ART_NAME in $ARTIFACTS; do
            echo "  📥 ${ART_NAME}..."
            mkdir -p "$ART_NAME"
            gh api "repos/${REPO}/actions/artifacts/$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq ".artifacts[] | select(.name==\"${ART_NAME}\") | .id")/zip" > "${ART_NAME}.zip"
            (cd "$ART_NAME" && unzip -q "../${ART_NAME}.zip")
            rm -f "${ART_NAME}.zip"
            echo "    ✅ $(ls "$ART_NAME" | wc -l) files"
          done

          # ── 3. Upload to COS (internal network) ──
          echo ""
          echo "📦 Uploading to COS (internal network)..."

          printf 'cos:\n  base:\n    secretid: %s\n    secretkey: %s\n  buckets:\n    - name: %s\n      alias: cos\n      endpoint: cos.%s.myqcloud.com\n' \
            "$COS_SID" "$COS_SKEY" "$COS_BUCKET" "$COS_REGION" > /tmp/.cos-release.yaml

          UPLOADED=0
          FAILED=0

          for dir in desktop-*/; do
            [ -d "$dir" ] || continue
            echo "📦 $(basename "$dir"):"

            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              case "$FILENAME" in .platform) continue;; esac

              FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              COS_PATH="cos://${COS_BUCKET}/releases/${VERSION}/${FILENAME}"
              echo "  ⬆️  ${FILENAME} ($(numfmt --to=iec $FILESIZE))"

              if coscli cp -c /tmp/.cos-release.yaml "$file" "$COS_PATH"; then
                echo "  ✅ ${FILENAME}"
                UPLOADED=$((UPLOADED + 1))
              else
                echo "  ❌ ${FILENAME} upload failed!"
                FAILED=$((FAILED + 1))
              fi
            done
          done

          rm -f /tmp/.cos-release.yaml

          echo ""
          echo "📊 Upload: ${UPLOADED} succeeded, ${FAILED} failed"
          if [ "$FAILED" -gt 0 ]; then echo "❌ Some uploads failed!"; exit 1; fi
          if [ "$UPLOADED" -eq 0 ]; then echo "❌ No files uploaded!"; exit 1; fi

          BASE_URL="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/releases/${VERSION}"
          echo "✅ All at: ${BASE_URL}/"

          # ── 4. Register release in database ──
          echo ""
          echo "📝 Registering release in database..."

          SQL_FILE=$(mktemp)
          printf 'BEGIN;\nUPDATE releases SET is_latest = false WHERE is_latest = true;\n' > "$SQL_FILE"

          echo "INSERT INTO releases (id, version, notes, pub_date, is_latest)
            VALUES (gen_random_uuid()::text, '${VERSION}', 'See changelog for details.', now(), true)
            ON CONFLICT (version) DO UPDATE SET is_latest = true, notes = EXCLUDED.notes;" >> "$SQL_FILE"

          for dir in desktop-*/; do
            [ -d "$dir" ] || continue
            PLATFORM=""
            [ -f "${dir}.platform" ] && PLATFORM=$(cat "${dir}.platform" | tr -d '[:space:]')
            [ -z "$PLATFORM" ] && continue

            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              case "$FILENAME" in *.sig|.platform) continue;; esac

              FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              DOWNLOAD_URL="${BASE_URL}/${FILENAME}"

              SIG=""
              [ -f "${file}.sig" ] && SIG=$(cat "${file}.sig")

              echo "INSERT INTO release_assets (id, release_id, platform, download_url, signature, file_size)
                SELECT gen_random_uuid()::text, r.id, '${PLATFORM}', '${DOWNLOAD_URL}', '${SIG}', ${FILESIZE}
                FROM releases r WHERE r.version = '${VERSION}'
                ON CONFLICT DO NOTHING;" >> "$SQL_FILE"

              echo "  📦 ${PLATFORM} → ${FILENAME} (${FILESIZE} bytes)"
            done
          done

          echo "COMMIT;" >> "$SQL_FILE"

          PGPASSWORD="${DB_PASSWORD}" psql -h 127.0.0.1 -U postgres -d jacoworks -v ON_ERROR_STOP=1 < "$SQL_FILE"
          rm -f "$SQL_FILE"
          echo "✅ Release registered (is_latest=true)"

          # ── 5. Cleanup ──
          rm -rf "$WORK_DIR"
          echo ""
          echo "🎉 Distribution complete for ${VERSION}"
          REMOTE_SCRIPT
