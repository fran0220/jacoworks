name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'website/**'
      - 'deploy/**'

# 串行部署，避免冲突
concurrency:
  group: deploy-jingao
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
            website:
              - 'website/**'
              - 'deploy/website/**'

  # ── 部署 Gateway ──
  deploy-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod

      - name: Build linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o gateway ./cmd/gateway

      - name: Deploy to jingao
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          HOST="${SSH_USER}@${SSH_HOST}"
          SSH="ssh -i ~/.ssh/deploy_key"
          SCP="scp -i ~/.ssh/deploy_key"

          $SCP gateway "$HOST:/tmp/jacoworks-gateway"
          $SSH "$HOST" "
            sudo systemctl stop jacoworks-gateway
            sudo mv /tmp/jacoworks-gateway /opt/jacoworks/gateway
            sudo chmod +x /opt/jacoworks/gateway
            sudo systemctl start jacoworks-gateway
            sleep 2
            curl -sf http://localhost:8847/health || (sudo systemctl status jacoworks-gateway; exit 1)
          "
          echo "✅ Gateway deployed"

  # ── 部署 Website ──
  deploy-website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website

      - name: Build release
        run: cargo build --release

      - name: Deploy to jingao
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          HOST="${SSH_USER}@${SSH_HOST}"
          SSH="ssh -i ~/.ssh/deploy_key"
          REMOTE="/opt/jacoworks/www"

          $SSH "$HOST" "sudo systemctl stop jacoworks-website 2>/dev/null || true; rm -rf /tmp/jacoworks-website"
          scp -i ~/.ssh/deploy_key target/release/jacoworks-website "$HOST:/tmp/jacoworks-website"
          $SSH "$HOST" "sudo mv -f /tmp/jacoworks-website $REMOTE/jacoworks-website"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" content/ "$HOST:/tmp/www-content/"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" static/ "$HOST:/tmp/www-static/"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" templates/ "$HOST:/tmp/www-templates/"
          $SSH "$HOST" "
            sudo rsync -a /tmp/www-content/ $REMOTE/content/
            sudo rsync -a /tmp/www-static/ $REMOTE/static/
            sudo rsync -a /tmp/www-templates/ $REMOTE/templates/
            sudo chmod +x $REMOTE/jacoworks-website
            sudo systemctl start jacoworks-website
            sleep 2
            curl -sf http://localhost:9527/ || (sudo systemctl status jacoworks-website; exit 1)
          "
          echo "✅ Website deployed"
