name: Test COS Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
    steps:
      - name: Create test file
        run: dd if=/dev/urandom of=/tmp/test-upload.bin bs=1M count=5

      - name: Install coscli
        run: |
          curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o /usr/local/bin/coscli
          chmod +x /usr/local/bin/coscli
          coscli --version

      - name: Upload directly to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          cat > /tmp/.cos.yaml <<EOF
          coscli:
            base:
              mode: SecretKey
              secretid: ${COS_SECRET_ID}
              secretkey: ${COS_SECRET_KEY}
            buckets:
              - name: ${COS_BUCKET}
                endpoint: cos.${COS_REGION}.myqcloud.com
                alias: cos
          EOF

          echo "📦 Uploading 5MB test file..."
          time coscli cp -c /tmp/.cos.yaml /tmp/test-upload.bin "cos://${COS_BUCKET}/test/cos-upload-test.bin"
          echo "✅ Upload done"

          echo "📋 Listing..."
          coscli ls -c /tmp/.cos.yaml "cos://${COS_BUCKET}/test/"

          echo "🧹 Cleanup..."
          coscli rm -c /tmp/.cos.yaml "cos://${COS_BUCKET}/test/cos-upload-test.bin" || true
          rm -f /tmp/.cos.yaml
          echo "✅ All done"
