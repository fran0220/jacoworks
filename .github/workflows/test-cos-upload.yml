name: Test COS Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
    steps:
      - name: Create test file
        run: |
          dd if=/dev/urandom of=/tmp/test-upload.bin bs=1M count=5
          echo "Test file created: $(ls -lh /tmp/test-upload.bin)"

      - name: Upload to COS via aws s3 (virtual-hosted)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COS_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          ENDPOINT="https://cos.${COS_REGION}.myqcloud.com"
          aws configure set default.s3.addressing_style virtual

          echo "📦 Uploading 5MB test file..."
          time aws s3 cp /tmp/test-upload.bin "s3://${COS_BUCKET}/test/cos-upload-test.bin" \
            --endpoint-url "$ENDPOINT" --region "$COS_REGION" --no-progress
          echo "✅ Upload succeeded"

      - name: Verify file exists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COS_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          ENDPOINT="https://cos.${COS_REGION}.myqcloud.com"
          aws s3 ls "s3://${COS_BUCKET}/test/" --endpoint-url "$ENDPOINT" --region "$COS_REGION"
          echo "✅ Verification done"

      - name: Cleanup test file
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COS_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          ENDPOINT="https://cos.${COS_REGION}.myqcloud.com"
          aws s3 rm "s3://${COS_BUCKET}/test/cos-upload-test.bin" \
            --endpoint-url "$ENDPOINT" --region "$COS_REGION" 2>/dev/null || true
