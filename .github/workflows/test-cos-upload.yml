name: Test COS Upload

on:
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
    steps:
      - name: Create test file
        run: |
          dd if=/dev/urandom of=/tmp/test-upload.bin bs=1M count=5
          echo "Test file created: $(ls -lh /tmp/test-upload.bin)"

      - name: Upload via jingao relay (same region as COS)
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key ${SSH_USER}@${SSH_HOST}"
          SCP="scp -i ~/.ssh/deploy_key"

          # SCP test file to jingao
          echo "📦 SCP to jingao..."
          time $SCP /tmp/test-upload.bin "${SSH_USER}@${SSH_HOST}:/tmp/test-upload.bin"
          echo "✅ SCP done"

          # Install coscli on jingao (if not present) + upload from there
          echo "📦 Uploading from jingao to COS (same region)..."
          time $SSH bash -s <<REMOTE
            set -e
            if [ ! -x /tmp/coscli ]; then
              curl -fsSL https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -o /tmp/coscli
              chmod +x /tmp/coscli
            fi

            # Generate config
            cat > /tmp/.cos.yaml <<EOF
coscli:
  base:
    mode: SecretKey
    secretid: ${COS_SECRET_ID}
    secretkey: ${COS_SECRET_KEY}
  buckets:
    - name: ${COS_BUCKET}
      endpoint: cos.${COS_REGION}.myqcloud.com
      alias: cos
EOF

            /tmp/coscli cp -c /tmp/.cos.yaml /tmp/test-upload.bin "cos://${COS_BUCKET}/test/cos-upload-test.bin"
            echo "✅ COS upload done"

            # Verify
            /tmp/coscli ls -c /tmp/.cos.yaml "cos://${COS_BUCKET}/test/"

            # Cleanup
            /tmp/coscli rm -c /tmp/.cos.yaml "cos://${COS_BUCKET}/test/cos-upload-test.bin" || true
            rm -f /tmp/test-upload.bin /tmp/.cos.yaml
          REMOTE

          echo "✅ All done"
