name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  # ── Version consistency check ──
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match tag
        run: bash desktop/src-tauri/scripts/check-versions.sh

  # ── Cross-compile vm-agent sidecar (all platforms, bun) ──
  build-sidecar:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
        working-directory: vm-agent
      - name: Cross-compile all targets
        working-directory: vm-agent
        run: |
          mkdir -p dist
          bun build --compile --target=bun-darwin-arm64  src/index.ts --outfile dist/vm-agent-aarch64-apple-darwin
          bun build --compile --target=bun-darwin-x64    src/index.ts --outfile dist/vm-agent-x86_64-apple-darwin
          bun build --compile --target=bun-windows-x64   src/index.ts --outfile dist/vm-agent-x86_64-pc-windows-msvc.exe
          echo "📦 Sidecar binaries:"
          ls -lh dist/vm-agent-*
      - uses: actions/upload-artifact@v4
        with:
          name: vm-agent-sidecar
          path: vm-agent/dist/vm-agent-*

  # ── Cross-platform Tauri build ──
  build-desktop:
    needs: build-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            platform: darwin-aarch64
            sidecar: vm-agent-aarch64-apple-darwin
            bundles: dmg,updater
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
            platform: darwin-x86_64
            sidecar: vm-agent-x86_64-apple-darwin
            bundles: dmg,updater
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            platform: windows-x86_64
            sidecar: vm-agent-x86_64-pc-windows-msvc.exe
            bundles: nsis,updater
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Download pre-built sidecar
      - uses: actions/download-artifact@v4
        with:
          name: vm-agent-sidecar
          path: sidecar-bin/

      # Unified resource preparation (sidecar + doc-packages + validation)
      - name: Prepare release resources
        shell: bash
        run: |
          bash desktop/src-tauri/scripts/prepare-release.sh \
            "${{ matrix.target }}" \
            --sidecar-from "sidecar-bin/${{ matrix.sidecar }}"

      # Windows: bundled bash + bun
      - name: Prepare Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: bash desktop/src-tauri/scripts/prepare-win-deps.sh

      - run: npm ci
        working-directory: desktop

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'JAcoworks ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG](https://jaco.jingao.club/docs/changelog) for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Collect build artifacts + write platform manifest
      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p dist-upload
          VERSION="${GITHUB_REF_NAME}"
          PLATFORM="${{ matrix.platform }}"
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"

          # macOS
          if [ -d "${BUNDLE_DIR}/dmg" ]; then
            cp ${BUNDLE_DIR}/dmg/*.dmg dist-upload/ 2>/dev/null || true
          fi
          if [ -d "${BUNDLE_DIR}/macos" ]; then
            find ${BUNDLE_DIR}/macos -name '*.tar.gz' -exec cp {} dist-upload/ \; 2>/dev/null || true
          fi

          # Windows (installer + updater artifact)
          if [ -d "${BUNDLE_DIR}/nsis" ]; then
            cp ${BUNDLE_DIR}/nsis/*.exe dist-upload/ 2>/dev/null || true
            cp ${BUNDLE_DIR}/nsis/*.nsis.zip dist-upload/ 2>/dev/null || true
          fi

          # Linux
          if [ -d "${BUNDLE_DIR}/deb" ]; then
            cp ${BUNDLE_DIR}/deb/*.deb dist-upload/ 2>/dev/null || true
          fi
          if [ -d "${BUNDLE_DIR}/appimage" ]; then
            cp ${BUNDLE_DIR}/appimage/*.AppImage dist-upload/ 2>/dev/null || true
          fi

          # Signatures (for updater)
          find ${BUNDLE_DIR} -name '*.sig' -exec cp {} dist-upload/ \; 2>/dev/null || true

          # Write platform manifest (eliminates filename-based guessing in distribute)
          echo "${PLATFORM}" > dist-upload/.platform

          echo "📦 Artifacts for ${PLATFORM}:"
          ls -la dist-upload/

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-upload/

  # ── Upload to COS + register in DB (separate workflow, can be re-triggered) ──
  distribute:
    needs: build-desktop
    uses: ./.github/workflows/distribute-desktop.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
