name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 用 bun 交叉编译 vm-agent sidecar (所有平台) ──
  build-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vm-agent/package-lock.json
      - run: npm ci
        working-directory: vm-agent
      - name: Cross-compile all targets
        working-directory: vm-agent
        run: |
          mkdir -p dist
          bun build --compile --target=bun-darwin-arm64  src/index.ts --outfile dist/vm-agent-aarch64-apple-darwin
          bun build --compile --target=bun-darwin-x64    src/index.ts --outfile dist/vm-agent-x86_64-apple-darwin
          bun build --compile --target=bun-windows-x64   src/index.ts --outfile dist/vm-agent-x86_64-pc-windows-msvc.exe
          echo "📦 Sidecar binaries:"
          ls -lh dist/vm-agent-*
      - uses: actions/upload-artifact@v4
        with:
          name: vm-agent-sidecar
          path: vm-agent/dist/vm-agent-*

  # ── 跨平台构建 Tauri 安装包 ──
  build-desktop:
    needs: build-sidecar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
            platform: darwin-aarch64
            sidecar: vm-agent-aarch64-apple-darwin
            bundles: dmg,updater
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
            platform: darwin-x86_64
            sidecar: vm-agent-x86_64-apple-darwin
            bundles: dmg,updater
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            platform: windows-x86_64
            sidecar: vm-agent-x86_64-pc-windows-msvc.exe
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # 下载 sidecar 二进制
      - uses: actions/download-artifact@v4
        with:
          name: vm-agent-sidecar
          path: sidecar-bin/

      # 放置 sidecar 到 Tauri externalBin 位置 + 打包 skills + 构建资源
      - name: Prepare sidecar and resources
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp sidecar-bin/${{ matrix.sidecar }} desktop/src-tauri/binaries/${{ matrix.sidecar }}
          chmod +x desktop/src-tauri/binaries/${{ matrix.sidecar }} || true

          # Pack skills archive
          mkdir -p desktop/src-tauri/resources
          tar -czf desktop/src-tauri/resources/skills.tar.gz -C vm-agent/skills .

          # Bundle doc-packages (npm packages for document processing)
          # Use --ignore-scripts --no-optional to avoid native binaries that break Apple notarization
          TMPD=$(mktemp -d)
          echo '{"private":true,"dependencies":{"mammoth":"^1.11.0","docx":"^9.6.0","exceljs":"^4.4.0","pdf-lib":"^1.17.1","@pdf-lib/fontkit":"^1.1.1","pdf-parse":"^2.4.5","csv-parse":"^6.1.0"}}' > "$TMPD/package.json"
          (cd "$TMPD" && npm install --production --no-optional --ignore-scripts --no-audit --no-fund --silent 2>/dev/null)
          # Remove any .node native binaries that may have slipped through
          find "$TMPD/node_modules" -name "*.node" -delete 2>/dev/null || true
          tar -czf desktop/src-tauri/resources/doc-packages.tar.gz -C "$TMPD" node_modules
          rm -rf "$TMPD"

          echo "📦 Sidecar binary:"
          ls -lh desktop/src-tauri/binaries/
          echo "📦 Resources:"
          ls -lh desktop/src-tauri/resources/

          # Verify sidecar is real (>= 1KB)
          SIDECAR_SIZE=$(stat -f%z "desktop/src-tauri/binaries/${{ matrix.sidecar }}" 2>/dev/null || stat -c%s "desktop/src-tauri/binaries/${{ matrix.sidecar }}" 2>/dev/null || echo 0)
          if [ "$SIDECAR_SIZE" -lt 1024 ]; then
            echo "❌ Sidecar binary too small ($SIDECAR_SIZE bytes), likely a placeholder"
            exit 1
          fi
          echo "✅ Sidecar size: $SIDECAR_SIZE bytes"

      # Windows: prepare bundled bash + bun
      - name: Prepare Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # On Windows CI, use the script to download deps
          # 7z is pre-installed on windows-latest
          bash desktop/src-tauri/scripts/prepare-win-deps.sh

      - run: npm ci
        working-directory: desktop

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
          # Apple code signing & notarization (macOS only, ignored on other platforms)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'JAcoworks ${{ github.ref_name }}'
          releaseBody: 'See [CHANGELOG](https://jaco.jingao.club/docs/changelog) for details.'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 收集构建产物用于后续上传到 jingao
      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p dist-upload
          VERSION="${GITHUB_REF_NAME}"
          TARGET="${{ matrix.target }}"
          PLATFORM="${{ matrix.platform }}"

          # 查找 Tauri 输出的安装包
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle"

          if [ -d "${BUNDLE_DIR}/dmg" ]; then
            cp ${BUNDLE_DIR}/dmg/*.dmg dist-upload/ 2>/dev/null || true
          fi
          if [ -d "${BUNDLE_DIR}/macos" ]; then
            # .app.tar.gz for updater
            find ${BUNDLE_DIR}/macos -name '*.tar.gz' -exec cp {} dist-upload/ \; 2>/dev/null || true
          fi
          if [ -d "${BUNDLE_DIR}/nsis" ]; then
            cp ${BUNDLE_DIR}/nsis/*.exe dist-upload/ 2>/dev/null || true
          fi
          # MSI 不收集，仅提供 NSIS EXE 安装包
          if [ -d "${BUNDLE_DIR}/deb" ]; then
            cp ${BUNDLE_DIR}/deb/*.deb dist-upload/ 2>/dev/null || true
          fi
          if [ -d "${BUNDLE_DIR}/appimage" ]; then
            cp ${BUNDLE_DIR}/appimage/*.AppImage dist-upload/ 2>/dev/null || true
          fi

          # 收集签名文件 (for updater)
          find ${BUNDLE_DIR} -name '*.sig' -exec cp {} dist-upload/ \; 2>/dev/null || true

          ls -la dist-upload/
          echo "platform=${PLATFORM}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-upload/

  # ── 上传到腾讯云 COS 分发 ──
  distribute:
    needs: build-desktop
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: jingao-1350796151
      COS_REGION: ap-beijing
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: desktop-*

      - name: Upload to COS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COS_SECRET_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ENDPOINT="https://cos.${COS_REGION}.myqcloud.com"

          # Force virtual-hosted style addressing (COS requirement)
          aws configure set default.s3.addressing_style virtual

          # Upload all platform artifacts via S3-compatible API (no interactive prompts)
          for dir in all-artifacts/desktop-*/; do
            if [ -d "$dir" ]; then
              echo "📦 Uploading from $dir"
              for file in "${dir}"*; do
                [ -f "$file" ] || continue
                FILENAME=$(basename "$file")
                FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
                echo "  ⬆️  ${FILENAME} ($(numfmt --to=iec $FILESIZE))"
                aws s3 cp "$file" "s3://${COS_BUCKET}/releases/${VERSION}/${FILENAME}" \
                  --endpoint-url "$ENDPOINT" --region "$COS_REGION" --no-progress
                echo "  ✅ ${FILENAME}"
              done
            fi
          done

          echo "✅ Artifacts uploaded to COS: https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/releases/${VERSION}/"

      - name: Register release in database
        env:
          SSH_KEY: ${{ secrets.JINGAO_SSH_KEY }}
          SSH_USER: ${{ secrets.JINGAO_SSH_USER }}
          SSH_HOST: ${{ secrets.JINGAO_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BASE_URL="https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com/releases/${VERSION}"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          HOST="${SSH_USER}@${SSH_HOST}"
          SSH="ssh -i ~/.ssh/deploy_key"

          # 生成 SQL 脚本 (本地构建，远程执行，避免复杂引号转义)
          SQL_FILE=$(mktemp)
          cat > "$SQL_FILE" <<'HEADER'
          BEGIN;
          -- Mark all existing releases as not latest
          UPDATE releases SET is_latest = false WHERE is_latest = true;
          HEADER

          echo "INSERT INTO releases (id, version, notes, pub_date, is_latest)
            VALUES (gen_random_uuid()::text, '${VERSION}', 'See changelog for details.', now(), true)
            ON CONFLICT (version) DO UPDATE SET is_latest = true, notes = EXCLUDED.notes;" >> "$SQL_FILE"

          # Collect assets from local artifacts
          for dir in all-artifacts/desktop-*/; do
            [ -d "$dir" ] || continue
            for file in "${dir}"*; do
              [ -f "$file" ] || continue
              FILENAME=$(basename "$file")
              case "$FILENAME" in *.sig) continue;; esac

              PLATFORM=''
              case "$FILENAME" in
                *aarch64*.dmg|*arm64*.dmg) PLATFORM='darwin-aarch64' ;;
                *x64*.dmg|*x86_64*.dmg)   PLATFORM='darwin-x86_64' ;;
                *.dmg)                     PLATFORM='darwin-aarch64' ;;
                *.exe)                     PLATFORM='windows-x86_64' ;;
                *.tar.gz)
                  if echo "$FILENAME" | grep -qi 'aarch64\|arm64'; then
                    PLATFORM='darwin-aarch64'
                  elif echo "$FILENAME" | grep -qi 'x86_64\|x64'; then
                    PLATFORM='darwin-x86_64'
                  fi
                  ;;
              esac
              [ -z "$PLATFORM" ] && continue

              FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
              DOWNLOAD_URL="${BASE_URL}/${FILENAME}"

              SIG=''
              if [ -f "${file}.sig" ]; then
                SIG=$(cat "${file}.sig")
              fi

              echo "INSERT INTO release_assets (id, release_id, platform, download_url, signature, file_size)
                SELECT gen_random_uuid()::text, r.id, '${PLATFORM}', '${DOWNLOAD_URL}', '${SIG}', ${FILESIZE}
                FROM releases r WHERE r.version = '${VERSION}'
                ON CONFLICT DO NOTHING;" >> "$SQL_FILE"

              echo "  📦 ${PLATFORM} → ${DOWNLOAD_URL} (${FILESIZE} bytes)"
            done
          done

          echo "COMMIT;" >> "$SQL_FILE"

          # Execute SQL on jingao via SSH
          $SSH "$HOST" "PGPASSWORD='${DB_PASSWORD}' psql -h 127.0.0.1 -U postgres -d jacoworks -v ON_ERROR_STOP=1" < "$SQL_FILE"
          rm -f "$SQL_FILE"
          echo "✅ Release registered in database (is_latest=true)"
