name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 变更检测 ──
  changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      website: ${{ steps.filter.outputs.website }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'gateway/**'
            website:
              - 'website/**'
            desktop:
              - 'desktop/**'
              - 'pi-config/**'
              - 'skills/**'

  # ═══════════════════════════════════════════
  #  Go 平台核心 (gateway/** 变更时触发)
  # ═══════════════════════════════════════════

  go-core:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - run: go vet ./...
      - run: go test ./...

  # ═══════════════════════════════════════════
  #  Gateway 构建
  # ═══════════════════════════════════════════

  build-gateway:
    needs: go-core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
      - name: Build gateway (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -o ../artifacts/gateway ./cmd/gateway
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-binary
          path: artifacts/gateway
          retention-days: 7

  # ═══════════════════════════════════════════
  #  Website 构建
  # ═══════════════════════════════════════════

  build-website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website
      - run: cargo check
      - run: cargo test
      - name: Build release binary
        run: cargo build --release
      - run: |
          mkdir -p ../artifacts/www
          cp target/release/jacoworks-website ../artifacts/www/
          cp -r content ../artifacts/www/
          cp -r static ../artifacts/www/
          cp -r templates ../artifacts/www/
      - uses: actions/upload-artifact@v4
        with:
          name: website-bundle
          path: artifacts/www
          retention-days: 7

  # ═══════════════════════════════════════════
  #  Desktop 检查
  # ═══════════════════════════════════════════

  desktop-check:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
